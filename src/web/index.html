<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zain ERP - نظام زين المحاسبي</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="assets/vendor/cairo.css" />
  <link rel="stylesheet" href="assets/app.css" />
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons.min.css" />
  <style>
    :root { --sidebar: 278px; }
    .sidebar { width: var(--sidebar); background: radial-gradient(circle at 20% 10%, #4f46e5 0%, #312e81 95%); }
    .main { margin-right: var(--sidebar); height: 100vh; overflow: auto; }
    .pos-panel { height: calc(100vh - 72px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .hidden { display: none !important; }
    [hidden] { display: none !important; }
  </style>
  <script>
    if (window.location.protocol === 'file:') {
      window.addEventListener('DOMContentLoaded', function() {
        var el = document.createElement('div');
        el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0f172a;color:#fff;z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Cairo,Segoe UI,Tahoma,sans-serif;direction:rtl;text-align:center;';
        el.innerHTML = '<div style="background:#1e293b;border:2px solid #ef4444;border-radius:18px;max-width:540px;padding:32px;box-shadow:0 25px 50px rgba(0,0,0,0.5);"><div style="font-size:48px;margin-bottom:12px;">⚠️</div><h2 style="font-size:22px;font-weight:900;margin-bottom:12px;color:#f87171;">تنبيه: فتح غير صحيح للنظام</h2><p style="font-size:15px;line-height:1.7;color:#cbd5e1;margin-bottom:20px;">تم فتح صفحة النظام مباشرة كملف محلي (file://). يعمل نظام زين كخادم سطح مكتب محلي ولا يمكن تشغيله بفتح ملف HTML يدوياً.<br><br><b>طريقة التشغيل الصحيحة:</b><br>1. شغّل البرنامج من اختصار سطح المكتب <b>Zain ERP</b> أو اضغط على <b>Zain.vbs</b>.<br>2. أو افتح المتصفح على: <code style="background:#334155;padding:3px 8px;border-radius:6px;color:#38bdf8;direction:ltr;display:inline-block;">http://127.0.0.1:4782</code></p><a href="http://127.0.0.1:4782" style="display:inline-block;background:#2563eb;color:#fff;font-weight:bold;padding:10px 24px;border-radius:10px;text-decoration:none;">فتح الرابط المحلي الآن</a></div>';
        document.body.appendChild(el);
      });
    }
    if (window.document.documentMode || (!window.CSS || !CSS.supports || !CSS.supports('display', 'flex'))) {
      window.addEventListener('DOMContentLoaded', function() {
        var el = document.createElement('div');
        el.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0f172a;color:#fff;z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:sans-serif;direction:rtl;text-align:center;';
        el.innerHTML = '<div style="background:#1e293b;border:2px solid #f59e0b;border-radius:18px;max-width:520px;padding:28px;"><div style="font-size:44px;margin-bottom:10px;">🌐</div><h2 style="font-size:20px;color:#fbbf24;margin-bottom:10px;">المتصفح الحالي غير مدعوم</h2><p style="font-size:14px;color:#cbd5e1;line-height:1.6;">يتطلب نظام زين متصفحاً حديثاً يدعم المعايير القياسية (مثل Microsoft Edge أو Google Chrome). يرجى فتح النظام بواسطة Microsoft Edge المتوفر في ويندوز 10.</p></div>';
        document.body.appendChild(el);
      });
    }
  </script>
</head>

<body>
  <div id="app" class="h-full flex flex-col">
    <div id="auth" class="fixed inset-0 bg-gradient-to-br from-zain-600 to-indigo-900 flex items-center justify-center p-4 print-hide">
      <div class="card w-full max-w-md p-8 animate-slide-up" style="background:#ffffff !important; border:2px solid #94a3af !important; box-shadow:0 20px 40px rgba(0,0,0,0.2) !important;">
        <div class="flex flex-col items-center mb-8">
          <img src="assets/logo.png" alt="Zain ERP" class="w-20 h-20 object-contain drop-shadow-md mb-2" />
          <h1 class="text-3xl font-black mt-4 text-slate-800">Zain ERP</h1>
          <p class="text-sm text-slate-500 mt-1">نظام المحاسبة والشامل الذكي</p>
        </div>
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="label text-slate-700 font-bold">اسم المستخدم</label>
            <input class="field font-bold" name="username" value="admin" autocomplete="username" style="background-color:#ffffff !important; color:#0f172a !important; border:2px solid #9ca3af !important; border-radius:0.75rem;" />
          </div>
          <div>
            <label class="label text-slate-700 font-bold">كلمة المرور</label>
            <input class="field font-bold" type="password" name="password" value="admin" autocomplete="current-password" style="background-color:#ffffff !important; color:#0f172a !important; border:2px solid #9ca3af !important; border-radius:0.75rem;" />
          </div>
          <button type="submit" class="btn btn-primary w-full h-12 text-base font-bold" style="background-color:#1d4ed8 !important; border:2px solid #1e40af !important; color:#ffffff !important; box-shadow:0 4px 14px rgba(29, 78, 216, 0.45) !important;">
            <i class="bi bi-box-arrow-in-left"></i> تسجيل الدخول
          </button>
          <div id="loginError" class="hidden text-center text-xs font-bold text-rose-600"></div>
        </form>
        <div class="text-center text-[11px] text-slate-400 mt-6">
          الإصدار 1.0.0 · متعدد الأنشطة · يعمل بدون إنترنت
        </div>
      </div>
    </div>

    <div id="main" class="hidden h-full" style="display:none">
      <aside class="sidebar fixed right-0 top-0 bottom-0 text-white flex flex-col print-hide">
        <div class="p-6 flex items-center gap-3 border-b border-white/10">
          <img src="assets/logo.png" alt="Zain ERP" class="w-12 h-12 object-contain rounded-xl bg-white/10 p-1" />
          <div>
            <h2 class="text-xl font-black">Zain</h2>
            <p class="text-[11px] text-indigo-200">ERP · إدارة ذكية</p>
          </div>
        </div>
        <nav id="nav" class="flex-1 p-4 space-y-1.5 overflow-auto hide-scrollbar"></nav>
        <div class="p-4 border-t border-white/10 space-y-2">
          <button id="shiftBtn" class="btn btn-ghost !bg-white/10 !text-indigo-50 !border-white/20 hover:!bg-white/20 w-full justify-between">
            <span id="shiftText">الورديات</span>
            <i class="bi bi-clock-history"></i>
          </button>
          <button id="settingsBtn" class="btn btn-ghost !bg-white/10 !text-indigo-50 !border-white/20 hover:!bg-white/20 w-full justify-between">
            <span>الإعدادات</span>
            <i class="bi bi-gear"></i>
          </button>
          <button id="logoutBtn" class="btn btn-ghost !bg-white/10 !text-indigo-50 !border-white/20 hover:!bg-white/20 w-full justify-between">
            <span id="userInfo">تسجيل الخروج</span>
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>
      </aside>

      <main class="main bg-slate-100">
        <header class="print-hide h-[72px] bg-white border-b border-slate-200 flex items-center justify-between px-6 sticky top-0 z-20 shadow-sm shadow-slate-500/5">
          <div class="flex items-center gap-3">
            <button class="btn btn-ghost h-10 w-10 p-0"><i class="bi bi-list text-lg"></i></button>
            <h1 id="pageTitle" class="text-lg font-black text-slate-800">لوحة التحكم</h1>
            <div id="statusBar" class="text-xs text-slate-500 pr-4 border-r border-slate-200 hidden"></div>
          </div>
          <div class="flex items-center gap-2">
            <button id="branchSelectorBtn" class="btn btn-ghost !bg-indigo-50 !text-indigo-700 !border-indigo-200 text-xs font-bold" title="الفرع الحالي">
              <i class="bi bi-geo-alt-fill text-indigo-500"></i> <span id="currentBranchName">فرع سموحة</span>
            </button>
            <button id="mobileSyncBtn" class="btn btn-ghost !bg-emerald-50 !text-emerald-700 !border-emerald-200 text-xs font-bold" title="متابعة عبر الموبايل">
              <i class="bi bi-phone text-emerald-500"></i> الموبايل
            </button>
            <button id="ownerPinBtn" class="btn btn-ghost !bg-amber-50 !text-amber-800 !border-amber-200 text-xs font-bold" title="تقارير المالك السرية">
              <i class="bi bi-shield-lock text-amber-600"></i> أرباح المالك
            </button>
            <button id="cloudSyncBtn" class="btn btn-ghost !bg-cyan-50 !text-cyan-800 !border-cyan-200 text-xs font-bold" title="المزامنة السحابية للفروع">
              <i class="bi bi-cloud-arrow-up text-cyan-600"></i> سحابي
            </button>
            <button id="licenseBtn" class="btn btn-ghost !bg-purple-50 !text-purple-800 !border-purple-200 text-xs font-bold" title="إدارة ترخيص وتفعيل النظام">
              <i class="bi bi-shield-check text-purple-600"></i> <span id="licenseText">الترخيص</span>
            </button>
            <button id="searchBtn" class="btn btn-ghost" title="بحث سريع (Ctrl+K)"><i class="bi bi-search"></i> بحث سريع</button>
            <button id="themeBtn" class="btn btn-ghost h-10 w-10 p-0" title="الوضع الداكن"><i class="bi bi-moon-stars" id="themeIcon"></i></button>
            <button id="refreshBtn" class="btn btn-ghost"><i class="bi bi-arrow-clockwise"></i> تحديث</button>
            <button id="posBtnTop" class="btn btn-primary"><i class="bi bi-cart-check"></i> نقاط البيع</button>
          </div>
        </header>
        <section id="content" class="p-5 space-y-5"></section>
      </main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="fixed top-20 left-6 flex flex-col gap-2 z-[60] print-hide"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
